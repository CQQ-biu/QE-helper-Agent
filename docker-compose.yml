services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: qe_helper
      POSTGRES_USER: qe_helper
      POSTGRES_PASSWORD: qe_helper
    ports:
      - "5432:5432"
    volumes:
      - qe_helper_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qe_helper -d qe_helper"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  qe_helper_postgres:
